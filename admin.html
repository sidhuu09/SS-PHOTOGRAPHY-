
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SS PHOTOGRAPHY | Admin Panel</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#101010;color:#f5f5f5}
    header{background:#171717;padding:20px;text-align:center;border-bottom:2px solid #d4af37}
    h1{color:#d4af37;margin:0;font-size:25px}
    .wrap{max-width:1100px;margin:22px auto;padding:15px}
    .card{background:#1c1c1c;border:1px solid #393939;border-radius:12px;padding:18px;margin-bottom:18px}
    input,button,select,textarea{width:100%;padding:12px;margin:7px 0;border-radius:7px;border:1px solid #555;font-size:15px}
    input,select,textarea{background:#111;color:#fff}
    button{background:#d4af37;color:#111;font-weight:bold;border:0;cursor:pointer}
    button.secondary{background:#444;color:white}
    button.danger{background:#a83232;color:white}
    .hidden{display:none!important}
    .booking{border:1px solid #494949;border-radius:9px;padding:14px;margin:12px 0;background:#151515}
    .booking h3{color:#e4c45d;margin-top:0}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .muted{color:#bbb;font-size:13px;overflow-wrap:anywhere}
    .status{color:#e4c45d;font-weight:bold}
    a{color:#77d9a5}
    #message{white-space:pre-wrap;color:#ffd66b}
    @media(max-width:600px){.row{grid-template-columns:1fr}.wrap{padding:10px}}
  </style>
</head>
<body>
<header>
  <h1>SS PHOTOGRAPHY</h1>
  <p>Admin Booking Management</p>
</header>

<main class="wrap">
  <section id="loginBox" class="card">
    <h2>Admin Login</h2>
    <input id="email" type="email" placeholder="Admin Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Login</button>
    <p class="muted">Only the authorized admin account can access bookings.</p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="card">
      <div class="row">
        <div>
          <h2>Bookings</h2>
          <p id="count">Loading...</p>
        </div>
        <div>
          <button id="refreshBtn">Refresh Bookings</button>
          <button id="logoutBtn" class="secondary">Logout</button>
        </div>
      </div>
      <label for="filter">Filter bookings</label>
      <select id="filter">
        <option value="All">All Bookings</option>
        <option value="Pending">Pending</option>
        <option value="Confirmed">Confirmed</option>
        <option value="Completed">Completed</option>
        <option value="Cancelled">Cancelled</option>
      </select>
      <p id="message"></p>
    </div>
    <div id="bookingsList"></div>
  </section>
</main>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, getDocs, doc, updateDoc,
  query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAViIeR7357V2aDxNVxx6Y2-LPassccPIc",
  authDomain: "ss-photography-ab010.firebaseapp.com",
  projectId: "ss-photography-ab010",
  storageBucket: "ss-photography-ab010.firebasestorage.app",
  messagingSenderId: "275799297604",
  appId: "1:275799297604:web:cbc8521e08594e6b72f611"
};

const ADMIN_UID = "fqnjsvfUwRMGiOuAvzK3PjXRemH3";
const WHATSAPP_NUMBER = "918144722094";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
let allBookings = [];

function showMessage(message) {
  $("message").textContent = message;
}

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[ch]));
}

function formatDate(value) {
  if (!value) return "—";
  if (typeof value === "string") return value;
  if (value.toDate) return value.toDate().toLocaleString();
  return "—";
}

onAuthStateChanged(auth, async user => {
  if (!user) {
    $("loginBox").classList.remove("hidden");
    $("dashboard").classList.add("hidden");
    return;
  }

  if (user.uid !== ADMIN_UID) {
    alert("Access denied: This account is not the authorized admin.");
    await signOut(auth);
    return;
  }

  $("loginBox").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  await loadBookings();
});

$("loginBtn").addEventListener("click", async () => {
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    alert("Enter your admin email and password.");
    return;
  }

  $("loginBtn").disabled = true;
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (error) {
    alert("Login failed: " + error.message);
  } finally {
    $("loginBtn").disabled = false;
  }
});

$("password").addEventListener("keydown", event => {
  if (event.key === "Enter") $("loginBtn").click();
});

$("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
});

$("refreshBtn").addEventListener("click", loadBookings);
$("filter").addEventListener("change", renderBookings);

async function loadBookings() {
  showMessage("Loading bookings...");
  $("refreshBtn").disabled = true;

  try {
    const bookingQuery = query(
      collection(db, "bookings"),
      orderBy("createdAt", "desc")
    );
    const snapshot = await getDocs(bookingQuery);
    allBookings = snapshot.docs.map(item => ({
      id: item.id, ...item.data()
    }));
    $("count").textContent = "Total bookings: " + allBookings.length;
    showMessage("");
    renderBookings();
  } catch (error) {
    showMessage("Could not load bookings: " + error.message);
  } finally {
    $("refreshBtn").disabled = false;
  }
}

function renderBookings() {
  const filter = $("filter").value;
  const items = allBookings.filter(b =>
    filter === "All" || (b.status || "Pending") === filter
  );

  if (!items.length) {
    $("bookingsList").innerHTML =
      '<div class="card">No bookings found for this filter.</div>';
    return;
  }

  $("bookingsList").innerHTML = items.map(b => {
    const cancellation = b.cancellationStatus || "None";
    const phone = String(b.mobile || "").replace(/\D/g, "");
    const waNumber = phone.startsWith("91") ? phone : "91" + phone;

    return `
      <article class="booking">
        <h3>Booking #${items.indexOf(b) + 1}</h3>
        <h3>${safe(b.customer || "Customer")}</h3>
        <p><b>Booking ID:</b> ${safe(b.id)}</p>
        <p><b>Mobile:</b> ${safe(b.mobile || "—")}</p>
        <p><b>Service:</b> ${safe(b.service || "—")}</p>
        <p><b>Event date:</b> ${safe(b.eventDate || "—")}</p>
        <p><b>Venue:</b> ${safe(b.venue || "—")}</p>
        <p><b>Details:</b> ${safe(b.details || "—")}</p>
        <p><b>Created:</b> ${safe(formatDate(b.createdAt))}</p>
        <p><b>Booking status:</b>
          <span class="status">${safe(b.status || "Pending")}</span>
        </p>
        <p><b>Cancellation:</b> ${safe(cancellation)}</p>
        <p><b>Cancellation reason:</b>
          ${safe(b.cancellationReason || "—")}
        </p>

        <label>Status</label>
        <select id="status-${safe(b.id)}">
          ${["Pending","Confirmed","Completed","Cancelled"].map(s =>
            `<option value="${s}" ${(b.status || "Pending") === s ? "selected" : ""}>${s}</option>`
          ).join("")}
        </select>
        <button data-action="status" data-id="${safe(b.id)}">
          Update Booking Status
        </button>

        ${cancellation === "Requested" ? `
          <div class="row">
            <button data-action="approve" data-id="${safe(b.id)}">
              Approve Cancellation
            </button>
            <button class="secondary" data-action="reject" data-id="${safe(b.id)}">
              Reject Cancellation
            </button>
          </div>` : ""}

        <a target="_blank" rel="noopener"
           href="https://wa.me/${safe(waNumber)}?text=${encodeURIComponent("Hello " + (b.customer || "") + ", regarding your SS PHOTOGRAPHY booking.")}">
           Contact Customer on WhatsApp
        </a>
      </article>`;
  }).join("");
}

$("bookingsList").addEventListener("click", async event => {
  const button = event.target.closest("button[data-action]");
  if (!button) return;

  const id = button.dataset.id;
  const action = button.dataset.action;
  const ref = doc(db, "bookings", id);
  button.disabled = true;

  try {
    if (action === "status") {
      const newStatus = $("status-" + id).value;
      if (!confirm("Change booking status to " + newStatus + "?")) return;

      await updateDoc(ref, {
        status: newStatus,
        statusUpdatedAt: serverTimestamp()
      });
      showMessage("Booking status updated.");
    }

    if (action === "approve") {
      if (!confirm("Approve cancellation and mark booking Cancelled?")) return;
      await updateDoc(ref, {
        status: "Cancelled",
        cancellationStatus: "Approved",
        cancellationReviewedAt: serverTimestamp()
      });
      showMessage("Cancellation approved.");
    }

    if (action === "reject") {
      if (!confirm("Reject this cancellation request?")) return;
      await updateDoc(ref, {
        cancellationStatus: "Rejected",
        cancellationReviewedAt: serverTimestamp()
      });
      showMessage("Cancellation rejected.");
    }

    await loadBookings();
  } catch (error) {
    showMessage("Update failed: " + error.message);
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
