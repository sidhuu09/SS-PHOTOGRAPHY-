
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SS PHOTOGRAPHY</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:24px 12px;background:#181818;border-bottom:2px solid #d4af37}
h1,h2{color:#d4af37}
main{max-width:760px;margin:auto;padding:14px}
.card{background:#1c1c1c;border:1px solid #444;border-radius:12px;padding:16px;margin:14px 0}
input,select,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:7px;font-size:15px}
input,select,textarea{background:#111;color:white;border:1px solid #555}
button{background:#d4af37;color:#111;border:0;font-weight:bold}
button.secondary{background:#333;color:white}
button.danger{background:#b83232;color:white}
.hidden{display:none}
.muted{color:#bbb;white-space:pre-wrap}
.booking{border:1px solid #555;border-radius:8px;padding:12px;margin:12px 0}
</style>
</head>
<body>
<header>
<h1>SS PHOTOGRAPHY</h1>
<p>Capture Your Beautiful Moments</p>
</header>
<main>
<div class="card" id="authCard">
<h2>Customer Login / Register</h2>
<p>Email account</p>
<input id="name" placeholder="Full name (for registration)">
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password (minimum 6 characters)">
<button id="registerBtn">Create Account</button>
<button id="emailLoginBtn" class="secondary">Login with Email</button>
<hr>
<p>Mobile OTP Login</p>
<input id="phone" type="tel" placeholder="Mobile number, e.g. +919876543210">
<div id="recaptcha-container"></div>
<button id="sendOtpBtn" class="secondary">Send OTP</button>
<input id="otp" inputmode="numeric" placeholder="Enter OTP">
<button id="verifyOtpBtn">Verify OTP & Login</button>
<p class="muted">Use your full international phone number, including +91 for India.</p>
</div>

<div class="card hidden" id="appCard">
<p id="welcome"></p>
<button id="logoutBtn" class="danger">Logout</button>
<h2>New Photography Booking</h2>
<form id="bookingForm">
<input id="customer" placeholder="Customer name" required>
<input id="mobile" type="tel" placeholder="Contact mobile number" required>
<select id="service" required>
<option value="">Choose service</option>
<option>Wedding Photography</option>
<option>Pre-Wedding Shoot</option>
<option>Birthday Photography</option>
<option>Engagement Photography</option>
<option>Event Photography</option>
<option>Portrait Photography</option>
<option>Other</option>
</select>
<label>Event date</label>
<input id="eventDate" type="date" required>
<input id="venue" placeholder="Venue / Location" required>
<textarea id="details" placeholder="Additional details"></textarea>
<button type="submit">Submit Booking</button>
</form>
<p id="message" class="muted"></p>
<h2>My Booking History</h2>
<div id="history"></div>
</div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
 getAuth,onAuthStateChanged,createUserWithEmailAndPassword,
 signInWithEmailAndPassword,signOut,updateProfile,
 RecaptchaVerifier,signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
 getFirestore,collection,addDoc,query,where,getDocs,
 doc,updateDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyAViIeR7357V2aDxNVxx6Y2-LPassccPIc",
 authDomain:"ss-photography-ab010.firebaseapp.com",
 projectId:"ss-photography-ab010",
 storageBucket:"ss-photography-ab010.firebasestorage.app",
 messagingSenderId:"275799297604",
 appId:"1:275799297604:web:cbc8521e08594e6b72f611"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);
let confirmation=null;
let recaptcha=null;

function say(text){$("message").textContent=text}
function setupRecaptcha(){
 if(recaptcha)return;
 recaptcha=new RecaptchaVerifier(auth,"recaptcha-container",{size:"normal"});
}

$("registerBtn").onclick=async()=>{
 try{
  const name=$("name").value.trim();
  const email=$("email").value.trim();
  const password=$("password").value;
  if(!name)throw Error("Enter your full name.");
  const result=await createUserWithEmailAndPassword(auth,email,password);
  await updateProfile(result.user,{displayName:name});
  alert("Account created successfully.");
 }catch(e){alert(e.message)}
};

$("emailLoginBtn").onclick=async()=>{
 try{
  await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);
 }catch(e){alert("Login failed: "+e.message)}
};

$("sendOtpBtn").onclick=async()=>{
 try{
  setupRecaptcha();
  confirmation=await signInWithPhoneNumber(auth,$("phone").value.trim(),recaptcha);
  alert("OTP sent. Check your SMS.");
 }catch(e){
  alert("OTP could not be sent: "+e.message);
  if(recaptcha){recaptcha.clear();recaptcha=null}
 }
};

$("verifyOtpBtn").onclick=async()=>{
 try{
  if(!confirmation)throw Error("Tap Send OTP first.");
  await confirmation.confirm($("otp").value.trim());
  confirmation=null;
 }catch(e){alert("OTP verification failed: "+e.message)}
};

$("logoutBtn").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
 $("authCard").classList.toggle("hidden",!!user);
 $("appCard").classList.toggle("hidden",!user);
 if(user){
  $("welcome").textContent="Logged in: "+(user.displayName||user.email||user.phoneNumber||"Customer");
  if(user.displayName)$("customer").value=user.displayName;
  if(user.phoneNumber)$("mobile").value=user.phoneNumber;
  await loadHistory(user);
 }
});

$("bookingForm").onsubmit=async e=>{
 e.preventDefault();
 const user=auth.currentUser;
 if(!user){say("Please log in first.");return}
 const eventDate=$("eventDate").value;
 if(eventDate<new Date().toISOString().slice(0,10)){
  say("Please select a future event date.");return;
 }
 try{
  say("Submitting booking...");
  await addDoc(collection(db,"bookings"),{
   uid:user.uid,
   customer:$("customer").value.trim(),
   mobile:$("mobile").value.trim(),
   service:$("service").value,
   eventDate,
   venue:$("venue").value.trim(),
   details:$("details").value.trim(),
   status:"Pending",
   cancellationStatus:"None",
   cancellationReason:"",
   createdAt:serverTimestamp()
  });
  say("Booking submitted successfully! Status: Pending.");
  $("bookingForm").reset();
  await loadHistory(user);
 }catch(e){say("Booking failed: "+e.message)}
};

async function loadHistory(user){
 const box=$("history");
 box.replaceChildren();
 try{
  const q=query(collection(db,"bookings"),where("uid","==",user.uid));
  const snap=await getDocs(q);
  if(snap.empty){box.textContent="No bookings yet.";return}
  const docs=snap.docs.sort((a,b)=>(b.data().eventDate||"").localeCompare(a.data().eventDate||""));
  docs.forEach(item=>{
   const b=item.data();
   const card=document.createElement("div");card.className="booking";
   const info=document.createElement("p");
   info.style.whiteSpace="pre-wrap";
   info.textContent="Service: "+(b.service||"-")+
    "\nEvent Date: "+(b.eventDate||"-")+
    "\nVenue: "+(b.venue||"-")+
    "\nBooking Status: "+(b.status||"Pending")+
    "\nCancellation: "+(b.cancellationStatus||"None")+
    (b.cancellationReason?"\nReason: "+b.cancellationReason:"");
   card.appendChild(info);
   if(!["Completed","Cancelled"].includes(b.status||"Pending") &&
      b.cancellationStatus!=="Requested"){
    const btn=document.createElement("button");
    btn.textContent="Request Cancellation";
    btn.className="danger";
    btn.onclick=async()=>{
     const reason=prompt("Please enter why you want to cancel this booking:");
     if(!reason||!reason.trim())return alert("Cancellation reason is required.");
     try{
      await updateDoc(doc(db,"bookings",item.id),{
       cancellationStatus:"Requested",
       cancellationReason:reason.trim(),
       cancellationRequestedAt:serverTimestamp()
      });
      alert("Cancellation request sent to Admin.");
      await loadHistory(user);
     }catch(e){alert("Request failed: "+e.message)}
    };
    card.appendChild(btn);
   }
   box.appendChild(card);
  });
 }catch(e){box.textContent="History could not load: "+e.message}
}
</script>
</body>
</html>
