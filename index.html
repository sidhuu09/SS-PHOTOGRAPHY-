
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SS PHOTOGRAPHY - Admin Panel</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px;
      background: #101010; color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    h1 { color: #d4af37; text-align: center; }
    .card {
      background: #1c1c1c; border: 1px solid #444;
      border-radius: 12px; padding: 16px;
      margin: 12px auto; max-width: 900px;
    }
    input, button, select {
      width: 100%; padding: 12px; margin: 6px 0;
      border-radius: 7px; border: 1px solid #555;
      font-size: 15px;
    }
    input, select { background: #111; color: white; }
    button {
      background: #d4af37; color: #111;
      font-weight: bold; border: none; cursor: pointer;
    }
    .wa { background: #25D366; color: white; }
    .danger { background: #b83232; color: white; }
    .muted { color: #bbb; }
    .hidden { display: none; }
    .status { color: #f0cf65; font-weight: bold; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 500px) {
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1>SS PHOTOGRAPHY</h1>
  <h2 style="text-align:center">Admin Booking Panel</h2>

  <div class="card" id="loginBox">
    <h3>Admin Login</h3>
    <input id="email" type="email" placeholder="Admin email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <p id="loginMessage" class="muted"></p>
  </div>

  <div class="card hidden" id="dashboard">
    <div class="row">
      <button id="refreshBtn">Refresh Bookings</button>
      <button id="logoutBtn" class="danger">Logout</button>
    </div>
    <p id="message" class="muted">Loading bookings...</p>
    <div id="bookings"></div>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth, signInWithEmailAndPassword,
      onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore, collection, getDocs, doc, updateDoc,
      query, orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAViIeR7357V2aDxNVxx6Y2-LPassccPIc",
      authDomain: "ss-photography-ab010.firebaseapp.com",
      projectId: "ss-photography-ab010",
      storageBucket: "ss-photography-ab010.firebasestorage.app",
      messagingSenderId: "275799297604",
      appId: "1:275799297604:web:cbc8521e08594e6b72f611"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = id => document.getElementById(id);

    $("loginBtn").addEventListener("click", async () => {
      const email = $("email").value.trim();
      const password = $("password").value;
      $("loginMessage").textContent = "Logging in...";

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        $("loginMessage").textContent =
          "Login failed: " + error.message;
      }
    });

    $("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
    });

    $("refreshBtn").addEventListener("click", loadBookings);

    onAuthStateChanged(auth, async user => {
      if (user) {
        $("loginBox").classList.add("hidden");
        $("dashboard").classList.remove("hidden");
        await loadBookings();
      } else {
        $("dashboard").classList.add("hidden");
        $("loginBox").classList.remove("hidden");
        $("loginMessage").textContent = "";
      }
    });

    async function loadBookings() {
      $("message").textContent = "Loading bookings...";
      $("bookings").replaceChildren();

      try {
        const snapshot = await getDocs(
          query(collection(db, "bookings"), orderBy("eventDate", "desc"))
        );

        if (snapshot.empty) {
          $("message").textContent = "No bookings found.";
          return;
        }

        $("message").textContent = "Total bookings: " + snapshot.size;

        snapshot.forEach(bookingDoc => {
          const b = bookingDoc.data();
          const id = bookingDoc.id;

          const card = document.createElement("div");
          card.className = "card";

          const heading = document.createElement("h3");
          heading.textContent = b.customer || "Customer";
          card.appendChild(heading);

          function addLine(label, value) {
            const p = document.createElement("p");
            p.textContent = label + ": " + (value || "-");
            card.appendChild(p);
          }

          addLine("Mobile", b.mobile);
          addLine("Service", b.service);
          addLine("Event Date", b.eventDate);
          addLine("Venue", b.venue);
          addLine("Details", b.details);
          addLine("Current Status", b.status || "Pending");

          const select = document.createElement("select");
          ["Pending", "Confirmed", "Completed", "Cancelled"].forEach(s => {
            const option = document.createElement("option");
            option.value = s;
            option.textContent = s;
            if ((b.status || "Pending") === s) option.selected = true;
            select.appendChild(option);
          });
          card.appendChild(select);

          const saveBtn = document.createElement("button");
          saveBtn.textContent = "Update Booking Status";
          saveBtn.addEventListener("click", async () => {
            try {
              saveBtn.disabled = true;
              await updateDoc(doc(db, "bookings", id), {
                status: select.value
              });
              alert("Booking status updated to " + select.value);
              await loadBookings();
            } catch (error) {
              alert("Status update failed: " + error.message);
            } finally {
              saveBtn.disabled = false;
            }
          });
          card.appendChild(saveBtn);

          const waBtn = document.createElement("button");
          waBtn.className = "wa";
          waBtn.textContent = "Customer Confirmation on WhatsApp";
          waBtn.addEventListener("click", () => {
            const phone = String(b.mobile || "").replace(/\D/g, "").slice(-10);

            if (phone.length !== 10) {
              alert("Customer mobile number thik nahi. Booking re check karantu.");
              return;
            }

            const status = select.value;
            let message;

            if (status === "Confirmed") {
              message =
                "Hello " + (b.customer || "Customer") +
                "! Your SS PHOTOGRAPHY booking is CONFIRMED." +
                "\nService: " + (b.service || "-") +
                "\nEvent Date: " + (b.eventDate || "-") +
                "\nVenue: " + (b.venue || "-") +
                "\nThank you for choosing SS PHOTOGRAPHY!";
            } else {
              message =
                "Hello " + (b.customer || "Customer") +
                ", your SS PHOTOGRAPHY booking status is: " + status +
                ".\nService: " + (b.service || "-") +
                "\nEvent Date: " + (b.eventDate || "-") +
                "\nThank you!";
            }

            const url = "https://wa.me/91" + phone +
              "?text=" + encodeURIComponent(message);
            window.open(url, "_blank");
          });
          card.appendChild(waBtn);

          $("bookings").appendChild(card);
        });
      } catch (error) {
        $("message").textContent =
          "Bookings load hela nahi: " + error.message;
      }
    }
  </script>
</body>
</html>
